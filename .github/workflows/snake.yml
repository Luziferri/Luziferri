name: Generate Snake

on:
  # Executa automaticamente à meia-noite
  schedule:
    - cron: "0 0 * * *" 
  
  # Permite executar manualmente na aba "Actions" para testar
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # --- CORREÇÃO IMPORTANTE: Permissão para gravar o arquivo ---
    permissions: 
      contents: write
    # -----------------------------------------------------------

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          # Usa automaticamente o dono do repositório (Luziferri)
          github_user_name: ${{ github.repository_owner }}
          
          # Gera dois arquivos: um normal e um ESCURO (Dark)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          # Envia para a branch "output"
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
